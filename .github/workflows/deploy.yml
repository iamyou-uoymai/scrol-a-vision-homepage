
name: Scrol-A-Vision CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scrol-a-vision-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build production application
        run: npm run build

      - name: Configure SSH
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KNOWN_HOSTS" \
            > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
        env:
          SSH_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}

      - name: Load deployment key
        if: github.event_name != 'pull_request'
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Prepare deployment directory
        if: github.event_name != 'pull_request'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          ssh -p "$VPS_PORT" \
            "$VPS_USER@$VPS_HOST" \
            'mkdir -p /docker/scrol-a-vision/website'

      - name: Deploy production build
        if: github.event_name != 'pull_request'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          rsync -az --delete \
            -e "ssh -p $VPS_PORT" \
            dist/ \
            "$VPS_USER@$VPS_HOST:/docker/scrol-a-vision/website/"
